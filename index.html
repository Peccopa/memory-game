<!doctype html>
<html lang="en" translate="no">
  <head>
    <!-- Encoding -->
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Project Name</title>
    <meta name="description" content="Short description of your project." />
    <meta name="keywords" content="project, javascript, vite" />
    <meta name="author" content="Your Name" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#ffffff" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Project Name" />
    <meta
      property="og:description"
      content="Short description of your project."
    />
    <meta property="og:image" content="/images/preview.png" />
    <meta property="og:url" content="https://github.com/Peccopa/" />
    <meta property="og:site_name" content="Project Name" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Project Name" />
    <meta
      name="twitter:description"
      content="Short description of your project."
    />
    <meta name="twitter:image" content="/images/preview.png" />

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
      rel="stylesheet"
    />

    <!-- App -->
    <script type="module" src="/src/main.js"></script>
  </head>

  <body></body>
</html>
